{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="topbar">
    <h1>{{ title }}</h1>
</div>

<form class="panel" method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}

    {% for field in form %}
        <div class="field">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {{ field.errors }}
        </div>
    {% endfor %}

    <div class="actions">
        <button class="btn" type="submit">Save</button>
        <a class="btn secondary" href="{% url 'faculty_list' %}">Cancel</a>
    </div>
</form>
{% endblock %}
