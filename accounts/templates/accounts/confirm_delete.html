{% extends "base.html" %}

{% block title %}Delete Faculty{% endblock %}

{% block content %}
<div class="topbar">
    <h1>Delete Faculty</h1>
</div>

<form class="panel" method="post">
    {% csrf_token %}
    <p>Delete {{ faculty.name }} from the faculty list?</p>
    <div class="actions">
        <button class="btn danger" type="submit">Delete</button>
        <a class="btn secondary" href="{% url 'faculty_list' %}">Cancel</a>
    </div>
</form>
{% endblock %}
