<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <style>
        body{
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }

        .container{
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: min(100%, 350px);
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2{
            text-align: center;
            margin-bottom: 20px;
        }

        input, select{
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button{
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background-color: #0056b3;
        }

        .errorlist{
            color: red;
            font-size: 14px;
            list-style: none;
            padding: 0;
        }

        .success{
            color: green;
            text-align: center;
            margin-bottom: 15px;
        }

        .login-link{
            text-align: center;
            margin-top: 15px;
        }

        .login-link a{
            text-decoration: none;
            color: #007bff;
        }

        .login-link a:hover{
            text-decoration: underline;
        }

        @media (max-width: 420px) {
            .container {
                padding: 22px;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Student Register</h2>

    <!-- Success Message -->
    {% if messages %}
        {% for message in messages %}
            <p class="success">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <!-- Student ID Number -->
        <label for="id_username">Student ID Number</label>
        {{ form.username }}
        {{ form.username.errors }}

        <!-- Department -->
        <label for="id_department">Department</label>
        {{ form.department }}
        {{ form.department.errors }}

        <button type="submit">Register</button>
    </form>

    <div class="login-link">
        <p>
            May account ka na?
            <a href="{% url 'login' %}">Login dito</a>
        </p>
    </div>

</div>

</body>
</html>
