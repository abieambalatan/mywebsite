<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            padding: 16px;
            font-family: Arial, sans-serif;
            background: #f6f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #172033;
        }
        .container {
            width: min(100%, 380px);
            background: white;
            border: 1px solid #e1e6ef;
            border-radius: 8px;
            padding: 28px;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
        }
        h1 {
            margin: 0 0 8px;
            font-size: 26px;
        }
        p {
            margin: 0 0 20px;
            color: #526071;
            line-height: 1.45;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
        }
        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccd5e1;
            border-radius: 6px;
            font: inherit;
        }
        .errorlist {
            padding: 0;
            margin: 8px 0 12px;
            color: #dc2626;
            list-style: none;
            font-size: 14px;
        }
        .btn {
            width: 100%;
            margin-top: 14px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            padding: 11px;
            font: inherit;
            cursor: pointer;
        }
        .links {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
        }
        a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Faculty Portal</h1>
        <p>Enter your faculty ID number to view your rating dashboard and achievement badge.</p>

        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <label for="{{ form.faculty_id.id_for_label }}">Faculty ID Number</label>
            {{ form.faculty_id }}
            {{ form.faculty_id.errors }}
            <button class="btn" type="submit">View Dashboard</button>
        </form>

        <div class="links">
            <a href="{% url 'home' %}">Back to home</a>
            |
            
        </div>
    </main>
</body>
</html>
