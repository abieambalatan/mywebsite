<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Register</title>

    <style>
        body{
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }

        .container{
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: min(100%, 350px);
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2{
            text-align: center;
            margin-bottom: 20px;
        }

        input{
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button{
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background-color: #0056b3;
        }

        .errorlist{
            color: red;
            font-size: 14px;
            list-style: none;
            padding: 0;
        }

        .login-link{
            text-align: center;
            margin-top: 15px;
        }

        .login-link a{
            text-decoration: none;
            color: #007bff;
        }

        .login-link a:hover{
            text-decoration: underline;
        }

        @media (max-width: 420px) {
            .container {
                padding: 22px;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Admin Register</h2>

    {{ form.non_field_errors }}

    <form method="POST">
        {% csrf_token %}

        <label for="id_username">Admin Username</label>
        {{ form.username }}
        {{ form.username.errors }}

        <label for="id_password">Password</label>
        {{ form.password }}
        {{ form.password.errors }}

        <label for="id_confirm_password">Confirm Password</label>
        {{ form.confirm_password }}
        {{ form.confirm_password.errors }}

        <button type="submit">Register</button>
    </form>

    <div class="login-link">
        <p>
            May admin account ka na?
            <a href="{% url 'admin_login' %}">Login dito</a>
        </p>
        <p>
            Student?
            <a href="{% url 'login' %}">Student login</a>
        </p>
    </div>

</div>

</body>
</html>
